[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "latticephys"
version = "0.4.0"
description = "Lattice structures, phonon spectra and lattice dynamics"
authors = [{ name = "Petar Cubela" }]
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["numpy", "matplotlib", "pygame-ce"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "SIM"]
ignore = ["SIM300"]  # allow `value == pytest.approx(expected)`
